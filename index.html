<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather city desk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Weather title</h1>
    <form action="details.html" method="get">
        <label for="region">Region</label>
        <select id="region" name="region">
            <option value="VIE">Vienna</option>
            <option value="LAT">Lower Austria</option>
            <option value="UAT">Upper Austria</option>
            <option value="BUR">Burgenland</option>
            <option value="CAR">Carinthia</option>
            <option value="STY">Styria</option>
            <option value="TYR">Tyrol</option>
            <option value="SAL">Salzburg</option>
            <option value="VOR">Vorarlberg</option>
        </select>
        <p></p>
        <label for="temperatureUnit">Temperature Unit</label>
        <select id="temperatureUnit" name="temperatureUnit">
            <option value="celsius">Celsius</option>
            <option value="fahrenheit">Fahrenheit</option>
        </select>
        <button type="submit">Go</button>
    </form>

</body>
</html>
